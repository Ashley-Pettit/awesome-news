<title>Awesome News</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app. Large-title header, sticky tabs across the top (For you, Local, Headlines, Politics, Finance,
   Tech, AI, plus the reader's own topics). Stories open in a full-screen reader; settings is a full-screen sheet.
   Queensland maroon is the single accent. */
:root {
  --bg: #f4f3f1;
  --surface: #ffffff;
  --ink: #17161a;
  --muted: #6a6670;
  --faint: #a19da6;
  --line: #e4e1e3;
  --accent: #7a1d33;
  --accent-ink: #ffffff;
  --accent-soft: #f1e3e7;
  --ok: #2f9a5b;
  --shade: rgba(23, 22, 26, 0.06);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 18px;
  --r-md: 12px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --read-size: 1.12rem;
  /* one colour per section, so you can tell them apart at a glance */
  --c-local: #7a1d33; --c-headlines: #2b4c7e; --c-politics: #6a3fa0; --c-finance: #1f7a52; --c-tech: #0b6e8a; --c-ai: #b25a00; --c-copilot: #0f6cbd; --c-topic: #7a1d33; --c-foryou: #7a1d33;
  --c-g-news: #2b4c7e; --c-g-tech: #0b6e8a; --c-g-life: #1f7a52; --c-g-culture: #a3306f; --c-g-planet: #4d7a1f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e11; --surface: #1a191d; --ink: #efecf1; --muted: #a8a4ae; --faint: #6c6872; --line: #2a282e;
    --accent: #ec8fa3; --accent-ink: #2a0b13; --accent-soft: #34191f; --ok: #4cc27d; --shade: rgba(0, 0, 0, 0.35); color-scheme: dark;
    --c-local: #ec8fa3; --c-headlines: #8fb3ff; --c-politics: #c4a5ff; --c-finance: #6fd6a3; --c-tech: #6cd3ef; --c-ai: #ffb86b; --c-copilot: #7cb8ff; --c-topic: #ec8fa3; --c-foryou: #ec8fa3;
    --c-g-news: #8fb3ff; --c-g-tech: #6cd3ef; --c-g-life: #6fd6a3; --c-g-culture: #f39acb; --c-g-planet: #a8d672;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e11; --surface: #1a191d; --ink: #efecf1; --muted: #a8a4ae; --faint: #6c6872; --line: #2a282e;
  --accent: #ec8fa3; --accent-ink: #2a0b13; --accent-soft: #34191f; --ok: #4cc27d; --shade: rgba(0, 0, 0, 0.35); color-scheme: dark;
    --c-local: #ec8fa3; --c-headlines: #8fb3ff; --c-politics: #c4a5ff; --c-finance: #6fd6a3; --c-tech: #6cd3ef; --c-ai: #ffb86b; --c-copilot: #7cb8ff; --c-topic: #ec8fa3; --c-foryou: #ec8fa3;
    --c-g-news: #8fb3ff; --c-g-tech: #6cd3ef; --c-g-life: #6fd6a3; --c-g-culture: #f39acb; --c-g-planet: #a8d672;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
main { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }

/* ---------- Header ---------- */
.head { padding-block: 12px 4px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dateline { margin-top: 14px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.brandline { display: flex; align-items: center; gap: 9px; min-width: 0; font-family: var(--display); font-size: 1.12rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brandmark { width: 30px; height: 30px; border-radius: 9px; flex: none; max-width: 100%; box-shadow: 0 2px 6px rgba(74, 14, 32, 0.3); }
.brand { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.bsep { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); flex: none; }
.wx { margin-top: 12px; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; max-width: 100%; padding: 6px 12px 6px 8px; border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-size: 0.8rem; color: var(--muted); }
.wx { cursor: pointer; text-align: left; color: var(--muted); }
.wx:active { transform: scale(0.98); }
.wx .more { color: var(--faint); font-size: 1.1rem; line-height: 1; margin-left: 2px; }
.wx svg { width: 20px; height: 20px; color: var(--c-ai); flex: none; }

/* Weather detail */
#weather { z-index: 43; }
.wx-place { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.wx-now { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.wx-now .big { font-family: var(--display); font-weight: 700; font-size: 4.4rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.wx-now svg { width: 74px; height: 74px; color: var(--c-ai); flex: none; }
.wx-cond { font-family: var(--display); font-size: 1.45rem; font-weight: 600; margin-top: 8px; }
.wx-sub { color: var(--muted); font-size: 0.92rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
.wx-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.wx-tile { background: var(--surface); border-radius: var(--r-md); box-shadow: 0 0 0 1px var(--line); padding: 12px; min-width: 0; }
.wx-tile .k { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.wx-tile .v { font-size: 1.12rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx-tile .s { font-size: 0.74rem; color: var(--muted); margin-top: 1px; }
.hours { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); padding: 2px var(--gut-r) 6px var(--gut-l); }
.hours::-webkit-scrollbar { display: none; }
.hour { flex: none; width: 60px; display: grid; justify-items: center; gap: 6px; padding: 11px 0; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hour.now { background: var(--accent-soft); box-shadow: none; color: var(--ink); font-weight: 700; }
.hour svg { width: 24px; height: 24px; color: var(--c-ai); }
.hour b { font-size: 0.98rem; color: var(--ink); }
.rainp { color: var(--c-headlines); font-size: 0.72rem; font-weight: 700; min-height: 1em; }
.day { display: grid; grid-template-columns: 58px 26px 40px 30px minmax(0, 1fr) 30px; align-items: center; gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.day:last-child { border-bottom: 0; }
.day .dn { font-weight: 700; }
.day svg { width: 24px; height: 24px; color: var(--c-ai); }
.day .lo { color: var(--muted); text-align: right; }
.day .hi { font-weight: 700; }
.range { position: relative; height: 6px; border-radius: 6px; background: var(--line); }
.range i { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #4c9be8, #f2a93b); }
.wx-foot { margin-top: 20px; font-size: 0.78rem; color: var(--muted); text-align: center; }
.wx b { color: var(--ink); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.wx .hl { font-variant-numeric: tabular-nums; }
.newcount { color: var(--accent); font-weight: 700; }
/* Compact status row: weather chip and update time side by side, small */
.hstat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; }
.hstat .wx { margin-top: 0; padding: 3px 9px 3px 6px; gap: 2px 6px; font-size: 0.72rem; border-radius: 14px; }
.hstat .wx svg { width: 15px; height: 15px; }
.hstat .wx b { font-size: 0.8rem; }
.hstat .wx .more { font-size: 0.9rem; }
.hstat .stamp { margin-top: 0; font-size: 0.72rem; gap: 5px; }
.hstat .live { width: 6px; height: 6px; }
.title { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.05; letter-spacing: -0.015em; margin: 4px 0 0; text-wrap: balance; }
.stamp { margin-top: 6px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.live.stale { background: var(--faint); }
.live.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.head-actions { display: flex; gap: 8px; flex: none; }
.icon-btn {
  position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none; margin-top: 2px;
  display: grid; place-items: center; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 2px 6px var(--shade);
  transition: transform 0.15s ease;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:disabled { cursor: default; }
.icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.icon-btn[aria-pressed="true"] svg path { fill: currentColor; }
.icon-btn.spin svg { animation: spin 0.9s linear infinite; color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.66rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--bg); }
.icon-btn[aria-pressed="true"] .badge { background: var(--surface); color: var(--accent); }

/* ---------- Tabs ---------- */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); margin-top: 8px; border-bottom: 1px solid var(--line); }
.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -6px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; position: relative; padding: 12px 10px 13px; font-size: 0.95rem; font-weight: 600; white-space: nowrap; color: var(--muted); }
.tab { transition: color 0.2s ease; }
.tab[aria-selected="true"] { color: var(--ink); }
.ink { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; border-radius: 3px 3px 0 0; background: var(--accent); pointer-events: none;
  transition: transform 0.32s cubic-bezier(.2,.8,.2,1), width 0.32s cubic-bezier(.2,.8,.2,1), background-color 0.32s ease; }
.tab.topic { font-style: italic; font-family: var(--display); font-size: 1.02rem; }

/* ---------- Shared story bits ---------- */
.meta { display: flex; align-items: center; gap: 7px; font-size: 0.72rem; color: var(--muted); min-width: 0; overflow: hidden; }
.src { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc, var(--ink)); white-space: nowrap; }
.sec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.new { flex: none; padding: 2px 6px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); font-size: 0.6rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
.fullb { flex: none; padding: 2px 7px; border-radius: 6px; background: rgba(47, 154, 91, 0.14); color: var(--ok); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.03em; white-space: nowrap; }
.hcard .fullb { background: rgba(76, 194, 125, 0.25); color: #c9f5da; }
.addtab { color: var(--accent); display: inline-flex; align-items: center; }
.addtab svg { width: 18px; height: 18px; }
#interests { z-index: 42; }
.lead-hint { color: var(--muted); margin: 6px 0 0; max-width: 46ch; }
.pick { display: flex; flex-wrap: wrap; gap: 10px; }
.pchip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 9px; border-radius: 999px; background: var(--surface);
  box-shadow: 0 0 0 1px var(--line); font-weight: 600; font-size: 0.95rem; color: var(--ink); transition: box-shadow 0.2s ease, transform 0.15s ease; }
.pchip:active { transform: scale(0.96); }
.pchip .ck { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--pc); color: transparent; transition: background-color 0.2s ease, color 0.2s ease; flex: none; }
.pchip .ck svg { width: 14px; height: 14px; }
.pchip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--pc); }
.pchip[aria-pressed="true"] .ck { background: var(--pc); color: var(--bg); }
.pchip .n { font-size: 0.72rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.field .sub.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chev { color: var(--faint); font-size: 1.5rem; line-height: 1; flex: none; }
.mins { white-space: nowrap; flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.meta time, .meta .sec, .meta .new { flex: none; }
.meta .src { flex: 0 1 auto; min-width: 3.5em; }
.meta time { white-space: nowrap; font-variant-numeric: tabular-nums; }
.sep { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); flex: none; }
.full { white-space: nowrap; font-weight: 600; color: var(--ok); }
.h { font-family: var(--display); font-weight: 600; letter-spacing: -0.005em; text-wrap: pretty; margin: 0; }
.dek { color: var(--muted); margin: 0; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.read .h, .read .dek { color: var(--faint); }
.read .src, .read .sec { color: var(--faint); }
.read img { opacity: 0.55; }

.pic { position: relative; overflow: hidden; background: var(--accent-soft); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.mono { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: var(--accent); letter-spacing: -0.01em; }

.story { position: relative; }
.story a.link:not([href]) { cursor: pointer; }
.story .link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.save { position: relative; z-index: 2; width: 34px; height: 34px; margin: -8px -8px -8px 0; flex: none; display: grid; place-items: center; color: var(--faint); border-radius: 50%; }
.save svg { width: 17px; height: 17px; }
.save[aria-pressed="true"] { color: var(--accent); }
.save[aria-pressed="true"] svg path { fill: currentColor; }

.lead { display: block; margin-top: 14px; }
.lead .pic { aspect-ratio: 16 / 9; border-radius: var(--r-lg); max-width: 100%; box-shadow: 0 6px 22px var(--shade); }
.lead .mono { font-size: 3rem; }
.lead .body { padding: 14px 2px 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; }
.lead .h { font-size: 1.62rem; line-height: 1.14; }
.lead .dek { font-size: 0.95rem; -webkit-line-clamp: 3; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tag { display: inline-block; padding: 4px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

/* Hero cards: headline over the picture (carousel on For you, lead story on each tab) */
.hero-rail {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  margin: 14px calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); padding: 2px var(--gut-r) 18px var(--gut-l); scroll-padding-left: var(--gut-l);
}
.hero-rail::-webkit-scrollbar { display: none; }
.hcard {
  position: relative; flex: 0 0 min(86%, 520px); scroll-snap-align: start; aspect-ratio: 4 / 5; max-height: 470px; max-width: 100%;
  border-radius: 22px; overflow: hidden; background: #241319; box-shadow: 0 14px 30px var(--shade);
  display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.2s ease;
}
.hcard:active { transform: scale(0.985); }
.hcard.solo { flex: none; width: 100%; aspect-ratio: 4 / 3.4; margin-top: 14px; }
.hcard .pic { position: absolute; inset: 0; background: #2a1a20; }
.hcard .pic img { transition: transform 6s ease; }
@media (hover: hover) { .hcard:hover .pic img { transform: scale(1.05); } }
.hcard::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to top, rgba(12, 6, 9, 0.94) 0%, rgba(12, 6, 9, 0.6) 40%, rgba(12, 6, 9, 0) 72%); }
.hcard .body { z-index: 2; padding: 18px 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; color: #ffffff; }
.hcard .chip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 9px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.16); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: #ffffff; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.hcard .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hc, #ff8aa0); box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
.hcard .h { color: #ffffff; font-size: 1.55rem; line-height: 1.14; text-wrap: balance; text-shadow: 0 1px 12px rgba(0,0,0,0.3); }
.hcard.solo .h { font-size: 1.7rem; }
.hcard .meta { color: rgba(255, 255, 255, 0.8); }
.hcard .src { color: #ffffff; }
.hcard .sep { background: rgba(255, 255, 255, 0.55); }
.hcard .save { position: absolute; top: 12px; right: 12px; margin: 0; width: 40px; height: 40px; z-index: 3; color: #ffffff;
  background: rgba(0, 0, 0, 0.32); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hcard.read .h { color: rgba(255, 255, 255, 0.72); }
.hcard.read img { opacity: 0.75; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -4px; }
.dots i { width: 6px; height: 6px; border-radius: 999px; background: var(--line); transition: width 0.25s ease, background-color 0.25s ease; }
.dots i.on { width: 20px; background: var(--accent); }
.feed-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 0; font-family: var(--display); font-weight: 700; font-size: 1.32rem; }
.feed-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Pull to refresh */
.ptr { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; z-index: 30; width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface); color: var(--accent); box-shadow: 0 6px 18px var(--shade), 0 0 0 1px var(--line); display: grid; place-items: center;
  transform: translate(-50%, -80px); opacity: 0; pointer-events: none; transition: transform 0.3s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease, background-color 0.2s ease; }
.ptr.pulling { transition: background-color 0.2s ease; }
.ptr.ready { background: var(--accent); color: var(--accent-ink); }
.ptr svg { width: 20px; height: 20px; }

/* Tab changes fade up */
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#view.swap > .wrap { animation: viewIn 0.34s cubic-bezier(.2,.8,.2,1); }

/* Reader progress */
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; pointer-events: none; }
.progress i { display: block; height: 100%; width: 0; background: var(--rc, var(--accent)); border-radius: 0 3px 3px 0; transition: width 0.12s linear; }

.feature { display: block; padding-block: 18px; border-bottom: 1px solid var(--line); }
.feature .pic { aspect-ratio: 16 / 9; border-radius: var(--r-md); max-width: 100%; }
.feature .mono { font-size: 2.4rem; }
.feature .body { padding-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }

  // ======================================================================
  const sectionKey = id => id === "local" ? `local-${S.region}` : id;

  const allSections = () => [...SECTIONS, ...((state.status?.interests) || [])
    .filter(x => !CORE_IDS.has(x.id)).map(x => ({ id: x.id, label: x.label, tag: x.label, group: x.group }))];

  const mutedRe = () => S.muted.length ? new RegExp(`\\b(${S.muted.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "i") : null;
  function allowed(list) {
    const mr = mutedRe();
    const hidden = S.hiddenSources;
    return list.filter(i => !hidden.some(h => i.source.startsWith(h)) && !(mr && mr.test(`${i.title} ${i.summary || ""}`)));
  }
  // Negative-news dial: each story gets a negativity score from its headline and summary

  // most negative first.
  const NEG_STRONG = /\b(?:kill(?:s|ed|ing)?|dead|deaths?|dies|died|dying|murder\w*|homicide|manslaughter|wars?|warfare|attacks?|attacked|bomb\w*|missiles?|airstrikes?|shooting|gunman|stabb\w*|terror\w*|massacre|genocide|rape\w*|sexual assault|abuse\w*|assault\w*|violen\w*|hostages?|fatal\w*|tragedy|tragic|disaster\w*|catastroph\w*|famine|starv\w*|earthquake|cyclone|tsunami|bushfires?|wildfires?|floods?|flooding|drown\w*|crash\w*|collapse\w*|recession|layoffs?|laid off|sacked|bankrupt\w*|insolven\w*|jailed|prison|sentenced|charged|arrest\w*|convicted|fraud\w*|scam\w*|scandal|corrupt\w*|ransomware|data breach|hack(?:ed|ers?)|outbreak|pandemic|overdose|suicide|victims?|injur\w*|hospitalis\w*|critical condition|missing|evacuat\w*|crisis|crises)\b/gi;
  const NEG_MILD = /\b(?:fears?|feared|warn\w*|threat\w*|risk\w*|danger\w*|crackdown|protest\w*|riots?|clash\w*|slump\w*|plunge\w*|tumbl\w*|losses|lose|losing|cuts?|shortage\w*|struggl\w*|decline\w*|worst|fail\w*|blame\w*|lawsuit|sued|fined|penalt\w*|probe|investigat\w*|police|court|accused|allegation\w*|toxic|pollut\w*|extinct\w*|endangered|drought|heatwave|inflation|debt|deficit|backlash|outrage|anger|angry|grief|mourn\w*|condemn\w*|sanctions?|tariffs?|strikes?|delay\w*|outage|vulnerab\w*|malware|spyware|leak\w*)\b/gi;

  function items(id) {

  // ======================================================================

  const CITY = { qld: ["Brisbane", -27.47, 153.03], nsw: ["Sydney", -33.87, 151.21], vic: ["Melbourne", -37.81, 144.96], wa: ["Perth", -31.95, 115.86],

    moon: `<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>`,
    cloud: `<path d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18z"/>`,
    partly: `<path d="M8 4.5V3M3.5 9.5H2M4.6 6.1l-1-1M12.4 6.1l1-1"/><circle cx="8" cy="9.5" r="3"/><path d="M9 20h9a3.5 3.5 0 0 0 .4-7 4.8 4.8 0 0 0-9.2 1.2A2.9 2.9 0 0 0 9 20z"/>`,
    rain: cloudTop + `<path d="M8 17.5l-1 2.5M12 17.5l-1 2.5M16 17.5l-1 2.5"/>`,
    storm: cloudTop + `<path d="M12.5 15l-2 3.5h3l-2 3.5"/>`,
    fog: `<path d="M4 9h16M6 13h12M4 17h16"/>`,
  }).map(([k, d]) => [k, `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`]));
  // Live forecast where the app can reach Open-Meteo; otherwise the snapshot that came with the news.
  async function loadWeather() {
    const c = CITY[S.region];
    if (!c) { state.wx = null; renderWxChip(); return; }
    const key = "brief.wx2." + S.region;
    let w = store.get(key, null);
    if (!w || Date.now() - w.at > 30 * 60000) {
      try {
        const u = `https://api.open-meteo.com/v1/forecast?latitude=${c[1]}&longitude=${c[2]}&timezone=auto&forecast_days=7`
          + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,is_day,uv_index,precipitation"
          + "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"
          + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max,sunrise,sunset,wind_speed_10m_max";
        const d = await withTimeout(fetch(u).then(r => r.json()), 10000);
        if (!d.current) throw new Error("no forecast");
        w = { at: Date.now(), d };
        store.set(key, w);

  }
  const wxIcon = (code, day) => { const [, ic] = WX(code); return WXI[ic === "sun" && !day ? "moon" : ic]; };
  const wxLabel = (code, day) => { const [label, ic] = WX(code); return ic === "sun" && !day ? "Clear" : label; };
  function renderWxChip() {
    const box = $("wx"), w = state.wx;
    if (!w) { box.hidden = true; return; }
    const cur = w.d.current, dy = w.d.daily, rain = dy.precipitation_probability_max?.[0] ?? 0;
    box.innerHTML = `${wxIcon(cur.weather_code, cur.is_day)}<b>${Math.round(cur.temperature_2m)}°</b><span>${wxLabel(cur.weather_code, cur.is_day)}</span>`
      + `${rain >= 30 ? `<span class="hl">${rain}% rain</span>` : ""}<span class="more" aria-hidden="true">›</span>`;

  const clock = t => { const [h, m] = t.slice(11, 16).split(":").map(Number); return `${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`; };
  const compass = deg => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
  const uvLabel = u => u < 3 ? "Low" : u < 6 ? "Moderate" : u < 8 ? "High" : u < 11 ? "Very high" : "Extreme";
  function renderWeather() {
    const w = state.wx;
    if (!w) { $("wBody").innerHTML = emptyHTML("No forecast right now", "The weather couldn't load. Check your connection and try again."); return; }
    const cur = w.d.current, hr = w.d.hourly, dy = w.d.daily;
    $("wBarTitle").textContent = `${w.city} weather`;
    // Next 24 hours, starting from the current hour.
    const nowKey = cur.time.slice(0, 13);
    let start = hr.time.findIndex(t => t.slice(0, 13) >= nowKey);
    if (start < 0) start = 0;
    const hours = hr.time.slice(start, start + 24).map((t, k) => {

    }).join("");
    // Next 7 days, with each day's range drawn against the whole week.
    const lo = Math.min(...dy.temperature_2m_min), hi = Math.max(...dy.temperature_2m_max), span = Math.max(1, hi - lo);

        + `<span class="lo">${Math.round(a)}°</span><span class="range"><i style="left:${((a - lo) / span) * 100}%;right:${100 - ((b - lo) / span) * 100}%"></i></span><span class="hi">${Math.round(b)}°</span></div>`;
    }).join("");
    const tile = (k, v, sub) => `<div class="wx-tile"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
    const uv = dy.uv_index_max?.[0] ?? cur.uv_index ?? 0;
    const updated = new Date(w.at).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" });
    $("wBody").innerHTML = `
      <div class="wx-place">${esc(w.city)} · ${esc(regionLabel())}</div>
      <div class="wx-now">${wxIcon(cur.weather_code, cur.is_day)}<span class="big">${Math.round(cur.temperature_2m)}°</span></div>
      <div class="wx-cond">${wxLabel(cur.weather_code, cur.is_day)}</div>
      <div class="wx-sub">Feels like ${Math.round(cur.apparent_temperature)}° · H ${Math.round(dy.temperature_2m_max[0])}° L ${Math.round(dy.temperature_2m_min[0])}°</div>
      <div class="wx-grid">
        ${tile("Rain", `${dy.precipitation_probability_max?.[0] ?? 0}%`, `${(dy.precipitation_sum?.[0] ?? 0).toFixed(1)} mm today`)}
        ${tile("Wind", `${Math.round(cur.wind_speed_10m)} km/h`, `${compass(cur.wind_direction_10m)}, gusts ${Math.round(cur.wind_gusts_10m)}`)}
        ${tile("Humidity", `${Math.round(cur.relative_humidity_2m)}%`, "")}
        ${tile("UV", `${Math.round(uv)}`, uvLabel(uv))}
        ${tile("Sunrise", clock(dy.sunrise[0]), "")}
        ${tile("Sunset", clock(dy.sunset[0]), "")}
      </div>
      <div class="group"><h2>Next 24 hours</h2><div class="hours">${hours}</div></div>
      <div class="group"><h2>Next 7 days</h2><div class="card" style="padding:0 14px">${days}</div></div>

  // ---- Static files (GitHub Pages) ----
  async function loadStatic(manual) {
    try {
      const st = await (await fetch(`data/status.json?t=${Date.now()}`, { cache: "no-store" })).json();
      const changed = st.updatedAt !== state.status?.updatedAt;
      if (changed || !state.loaded) {
        const v = encodeURIComponent(st.updatedAt);
        const names = st.sections || [];
        const docs = await Promise.all(names.map(n => fetch(`data/feeds/${n}.json?v=${v}`).then(r => r.ok ? r.json() : null).catch(() => null)));
        const feeds = {};

      saveOffline();
      if (!state.wx) loadWeather();
    } catch {
      state.loaded = true;
      if (manual) finishRefresh(false);
      render();
      toast(state.fromCache ? "You're offline. Showing the stories saved on this device." : "Stories couldn't load. Check your connection and try again.", 5000);
    }
  }

  // ---- Claude database (private copy) ----
  function loadClaude(db) {
    state.db = db;
    let first = 2;
    const arrived = () => {
      if (--first <= 0) { state.loaded = true; saveOffline(); loadWeather(); }
      if (!openSheet) render(true); else renderHeader();
    };
    db.collection("feeds").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      if (Object.keys(next).length || !state.fromCache) state.feeds = next;  // never swap the saved copy for an empty offline answer
      arrived();
    }, () => { state.loaded = true; render(); toast(state.fromCache ? "You're offline. Showing the stories saved on this device." : "Stories couldn't load. Check your connection and reopen the page.", 6000); });
    db.doc("meta/status").onSnapshot(snap => {
      const prev = state.status?.updatedAt;
      if (!snap.exists && state.fromCache) { arrived(); return; }
      state.status = snap.exists ? snap.data() : null;
      if (state.status?.updatedAt !== prev) for (const k in textCache) delete textCache[k];
      if (state.refreshing && state.status?.updatedAt && state.status.updatedAt !== prev) finishRefresh(true);
      bgRefresh();
      arrived();
    }, () => arrived());
  }

  async function refreshNow() {
    if (state.refreshing) return;
    state.refreshing = true;
    renderHeader();
    if (state.mode === "static") { loadStatic(true); return; }
    try {
      if (!state.mcp) throw { code: "server_not_connected" };
      await state.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: state.status.triggerId }, { cache: false });
      toast("Refreshing. New stories will appear on their own.", 4000);
      setTimeout(() => finishRefresh(false), 600000);
    } catch (e) {
      finishRefresh(false);
      const c = e && e.code;
      if (c === "not_in_manifest") toast("Refresh is switched off. Allow Claude Code Remote in this page's permissions.", 6000);
      else if (c === "server_not_connected" || c === "needs_reauth") toast("Refresh needs the Claude Code Remote connector. Stories still update on schedule.", 6000);
      else toast("Refresh couldn't start. Stories still update on schedule.", 5000);
    }
  }

  // Show the copy kept on this device straight away; live data replaces it when it arrives.
  Promise.all([idb.get("feeds"), idb.get("status")]).then(([f, s]) => {
    if (!f || !Object.keys(f).length || (state.loaded && Object.keys(state.feeds).length)) return;
    state.feeds = f; state.status = state.status || s || null; state.fromCache = true; state.loaded = true;
    if (state.mode === "static") { const raw = store.get("brief.vaultKey", ""); if (raw && A.unlocked && A.full) keyFrom(b64(raw)).then(k => { vaultKey = vaultKey || k; applyVault(); if (!openSheet) render(true); }).catch(() => {}); }
    if (!openSheet) render(true); else renderHeader();
  });

  use("db").then(db => {
    if (db) { state.mode = "claude"; loadClaude(db); use("mcp").then(m => { state.mcp = m; bgRefresh(); }); return; }
    state.mode = "static";
    try { navigator.storage?.persist?.(); } catch {}  // ask the phone to keep this app's saved settings
    restoreVault();
    state.canPull = true;
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    loadStatic(false);
    loadWeather();
    setInterval(() => { if (!document.hidden) loadWeather(); }, 15 * 60000);
    // Pick up new stories while the app stays open.
    setInterval(() => { if (!document.hidden) loadStatic(false); }, 10 * 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - Date.parse(state.status?.updatedAt || 0) > 30 * 60000) loadStatic(false); });
  });
})();
</script>
