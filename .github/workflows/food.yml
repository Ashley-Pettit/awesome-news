name: Food in the area

# Moorooka's "Food in the area": once a week, the cafes, restaurants, takeaways, pubs and bars near the shops, from
# OpenStreetMap, written into app.html (tools/food.py), then the quick publish puts the list in every app.
on:
  schedule:
    - cron: "23 17 * * 0"     # Monday 3:23am Brisbane
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: food
  cancel-in-progress: false

jobs:
  food:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the places
        run: python3 tools/food.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html local/food-edits.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Food in the area: places near Moorooka from OpenStreetMap"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run quick.yml --ref main
