name: Forecast check (one-off)
on:
  push:
    branches: [wx-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      - uses: actions/upload-artifact@v4
        with:
          name: wx
          path: out
