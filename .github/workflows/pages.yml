name: Update news and publish

on:
  schedule:
    - cron: "47 19 * * *"   # once a day, 5:47am Brisbane. Opening the app can start extra updates (Settings > Reading > Update when I open the app).
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch the news
        # Public site: every state's Local edition, every interest, publisher image links,
        # and open article text only where the licence allows it (CC and public-domain sources).
        # Every other story's full text is published locked with the NEWS_KEY passphrase, so only
        # devices that enter it in Settings > Reading can read it. Without the secret, that part is skipped.
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}  # optional: TV keeps working when YouTube's free feed is down
        run: python fetcher.py _site/data --regions all --images url --text cc --interests all --private-text NEWS_KEY --archive-from https://ashley-pettit.github.io/awesome-news/

      # Ready-made voice: the news read aloud in a natural voice (Kokoro), made here so phones just
      # play it. Audio made on earlier runs is reused; new audio is made until the time budget runs out.
      - name: Voice model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-v1.0

      - name: Get the voice model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL -o kokoro/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done

      - name: Make the audio
        continue-on-error: true   # the news still goes out if this fails
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          KOKORO_DIR: kokoro
          # Most time on the daily run; a quick top-up when an update is started from the app.
          BUDGET: ${{ github.event_name == 'schedule' && '2400' || github.event_name == 'push' && '600' || '240' }}
        run: |
          pip install -q "kokoro-onnx==0.6.1" "lameenc==1.9.0"
          python voice.py _site/data --reuse-from https://ashley-pettit.github.io/awesome-news/ --budget "$BUDGET"

      - name: Build the page
        run: python build.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
