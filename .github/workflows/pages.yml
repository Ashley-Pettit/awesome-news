name: Update news and publish

on:
  schedule:
    - cron: "47 19-23,0-11 * * *"   # every hour, 5:47am to 9:47pm Brisbane, so the news keeps turning over through the day

  workflow_dispatch:
    inputs:
      focus:
        description: "Sections Emma reads first (the app's Update now sends someone's new picks, e.g. wildlife,local-inv)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch the news
        # Public site: every state's Local edition, every interest, publisher image links,
        # and open article text only where the licence allows it (CC and public-domain sources).
        # Every other story's full text is published locked with the NEWS_KEY passphrase, so only
        # devices that enter it in Settings > Reading can read it. Without the secret, that part is skipped.
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}  # optional: TV keeps working when YouTube's free feed is down
        # Once in a while the script crashes inside a picture or page library: try once more before giving up.
        run: |
          A="_site/data --regions all --images url --text cc --interests all --private-text NEWS_KEY --archive-from https://ashley-pettit.github.io/awesome-news/"
          python fetcher.py $A || { echo "Retrying after a crash"; sleep 20; python fetcher.py $A; }

      - name: Build the page
        run: python build.py _site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  # Ready-made voice: the news read aloud in a natural voice (Kokoro), made here so phones just play it.
  # Eight machines side by side each make their share. Audio made on earlier runs is reused.
  voice:
    needs: news
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true   # the news still goes out if this fails
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt "kokoro-onnx==0.6.1" "lameenc==1.9.0"

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Voice model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-v1.0

      - name: Get the voice model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL -o kokoro/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done

      - name: Make the audio
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          KOKORO_DIR: kokoro
          # Most time on the daily run; a quick top-up when an update is started from the app.
          BUDGET: ${{ github.event_name == 'schedule' && '2400' || github.event_name == 'push' && '900' || inputs.focus && '900' || '240' }}
          FOCUS: ${{ inputs.focus }}
        run: python voice.py _site/data --shard ${{ matrix.shard }}/8 --reuse-from https://ashley-pettit.github.io/awesome-news/ --budget "$BUDGET"

      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.shard }}
          path: _site/data/voice
          retention-days: 1

  publish:
    needs: [news, voice]
    if: ${{ always() && needs.news.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: voice-*
          path: _site/data/voice
          merge-multiple: true

      # Always publish the newest app: a quick publish may have put out a newer page while this run was busy,
      # and this run mustn't put the older one back.
      - name: Use the newest app
        continue-on-error: true
        run: |
          git fetch -q --depth=1 origin main
          git checkout FETCH_HEAD -- app.html build.py
          git checkout FETCH_HEAD -- beta sw.js icons manifest.webmanifest 2>/dev/null || true
          python build.py _site

      # A link-preview page for every story (s/<id>), for sharing.
      - name: Share pages
        continue-on-error: true
        run: |
          git checkout FETCH_HEAD -- share.py 2>/dev/null || true
          python share.py _site

      - name: Join the audio lists
        continue-on-error: true
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
          FOCUS: ${{ inputs.focus }}
        run: python voice.py _site/data --merge

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
