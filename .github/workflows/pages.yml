name: Update news and publish

on:
  schedule:
    - cron: "47 19 * * *"   # once a day, 5:47am Brisbane. Opening the app can start extra updates (Admin > Update when I open the app).
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch the news
        # Public site: every state's Local edition, every interest, publisher image links,
        # and open article text only where the licence allows it (CC and public-domain sources).
        # Every other story's full text is published locked with the NEWS_KEY passphrase, so only
        # devices that enter it in Admin can read it. Without the secret, that part is skipped.
        env:
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
        run: python fetcher.py _site/data --regions all --images url --text cc --interests all --private-text NEWS_KEY

      - name: Build the page
        run: python build.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
