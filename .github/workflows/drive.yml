name: Ash's drive

# Weekdays before the 7:45am drive to work, and in the afternoon for the drive home: works out the drive time and
# what QLDTraffic reports on the way, and keeps it on the "drive" branch as drive.json. A scheduled task copies it
# into the private Claude copy of the app, which can't reach those services itself.
on:
  schedule:
    # About 30 minutes before each copy into the Claude app (6:50am, 7:30am, 4:20pm), as GitHub often starts these late
    - cron: "17 20 * * 0-4"   # 6:17am Brisbane, Monday to Friday
    - cron: "37 20 * * 0-4"   # 6:37am: done in time for the private copy's 6:59am refresh to pick it up
    - cron: "47 5 * * 1-5"    # 3:47pm
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive
  cancel-in-progress: true

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Work out the drive
        run: python drive.py /tmp/drive.json
      - name: Keep it on the drive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan drive-tmp
          git rm -rfq .
          cp /tmp/drive.json drive.json
          git add drive.json
          git commit -qm "[skip ci] Drive $(date -u +%FT%TZ)"
          git push -fq origin HEAD:drive
